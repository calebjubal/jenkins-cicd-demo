name: Hello CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs so deployments do not overlap; allow an active run to finish.
concurrency:
  group: hello-cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: Checkout → Build → Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Test
        run: npm test
      - name: Failure
        if: failure()
        run: echo 'Pipeline failed. Inspect the build and test logs.'

  deploy:
    name: Deploy
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # Assign this label to ONE persistent deployment host with local Docker.
    runs-on: [self-hosted, cicd-demo]
    timeout-minutes: 15
    concurrency:
      group: hello-cicd-deployment
      cancel-in-progress: false
    env:
      BUILD_NUMBER: ${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Deploy
        run: npm run deploy
      - name: Success
        if: success()
        run: echo 'CI/CD Pipeline completed successfully; deployment health verified.'
      - name: Failure
        if: failure()
        run: echo 'Pipeline failed. Inspect the deployment logs.'
